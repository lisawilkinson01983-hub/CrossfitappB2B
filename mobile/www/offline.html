<!doctype html>
<!-- Shown by the native app when https://box2box.social can't be reached
     (no signal, flight mode) — see capacitor.config.json's server.errorPath. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Box 2 Box</title>
    <style>
      :root { color-scheme: light dark; --bg: #e9e6df; --ink: #232223; --accent: #b8842a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #28282c; --ink: #f2f1ee; --accent: #e7c377; } }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; opacity: 0.7; }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 10px;
        padding: 12px 24px; font: inherit; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Box 2 Box needs an internet connection.<br />Check your signal or Wi-Fi and try again.</p>
      <button type="button" onclick="location.href='https://box2box.social/feed'">Try again</button>
    </main>
  </body>
</html>
